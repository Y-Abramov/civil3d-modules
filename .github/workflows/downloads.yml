name: downloads

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-ledger
  cancel-in-progress: false

jobs:
  downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update downloads ledger
        run: node scripts/update-downloads.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed ledger
        run: |
          git add --intent-to-add -- downloads.json
          if ! git diff --quiet -- downloads.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
            git add -- downloads.json
            git commit -m 'chore: downloads ledger'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Sync ledger to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 cp downloads.json s3://abrmove-modules/bundle/downloads.json \
            --endpoint-url https://storage.yandexcloud.net \
            --acl public-read --content-type application/json
